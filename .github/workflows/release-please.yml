name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: node

  # No publish job: publishing is manual until `titw` exists on the npm
  # registry and an npm Trusted Publisher (OIDC) is registered for this repo.
  # Do not re-add a token-based `npm publish` step here — there is no
  # NPM_TOKEN secret configured, and the intent is to adopt Trusted
  # Publishing rather than mint one.
